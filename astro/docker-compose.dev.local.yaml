version: "3.8"

services:
  astro_dev:
    container_name: ${PROJECT_NAME?err}_astro_dev_local
    image: ${PROJECT_NAME?err}_astro_dev_local
    restart: on-failure
    ports:
      - 3456:3333
    build:
      context: ./
      dockerfile: ./Dockerfile.dev
    volumes:
      - "./:/app"
      # node_modules is a symlink to node_modules.nosync (kept out of iCloud). Running npm ci in /app
      # would replace the symlink with a real folder, so install from /deps into node_modules.nosync.
      - "./package.json:/deps/package.json"
      - "./package-lock.json:/deps/package-lock.json"
      - "./node_modules.nosync:/deps/node_modules"
    command: >
      bash -c "npm ci --prefix /deps && npm run dev"
